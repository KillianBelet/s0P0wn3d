name: CI

on:
  push:
    branches: [ develop, feature/** ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW
        run: choco install mingw -y

      - name: Check C syntax
        run: |
          Get-ChildItem -Recurse -Filter "*.c" -Path "src/" | ForEach-Object {
            Write-Host "Checking $($_.FullName)"
            gcc -Wall -Wextra -fsyntax-only $_.FullName
          }
        shell: powershell

      - name: Verify structure
        run: |
          if (!(Test-Path "src/implant/core")) { exit 1 }
          if (!(Test-Path "src/controller/server")) { exit 1 }
          if (!(Test-Path "src/implant/payloads")) { exit 1 }
          Write-Host "Structure OK"
        shell: powershell
